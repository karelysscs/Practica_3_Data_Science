# =========================================================================
# Configuración central de la Tarea 2 — Radar de Contrataciones Públicas
# Ningún valor operativo debe estar hardcodeado en el código: vive aquí.
# Credenciales (OPENAI_API_KEY) van en el .env de la raíz del repo.
# =========================================================================

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  outputs_dir: "data/outputs"
  logs_dir: "logs"
  eval_dir: "eval"

# --- Fase 1: adquisición de datos ---------------------------------------------
source:
  portal_base_url: "https://contratacionesabiertas.oece.gob.pe"
  api_base_url: "https://contratacionesabiertas.oece.gob.pe/api/v1"
  bulk_file_url_template: "{api_base_url}/file/{system}/json/{year}/{month:02d}"
  system: "seace_v3"
  # Meses obligatorios de descarga masiva (mínimo 3 meses de 2026, requisito del issue)
  bulk_months:
    - {year: 2026, month: 7}
    - {year: 2026, month: 8}
    - {year: 2026, month: 9}

incremental_updates:
  # "Recent updates" vía API (no vía descarga masiva): se listan releases recientes
  # (granularidad "release") y por cada OCID nuevo/activo se pide su record
  # compilado actual (granularidad "record") para actualizar el dataset procesado.
  lookback_days: 3
  page_size: 20              # tamaño de página real que respeta la API (ver notas en acquisition.py)
  max_pages: 25               # techo defensivo para no recorrer indefinidamente
  throttle_seconds: 0.35       # pausa entre llamadas a la API (throttling)
  cache_ttl_hours: 12          # no re-pedir /record/{ocid} si el cache tiene menos de esto

http:
  user_agent: "Mozilla/5.0 (compatible; RAG-Radar-Tarea2/1.0; proyecto academico)"
  timeout_seconds: 60
  retries: 3
  retry_backoff_seconds: 2.0

# --- Fase 2: validación y normalización ---------------------------------------
validation:
  zero_amount_threshold: 0.0   # tender.value.amount <= esto se marca "monto en cero/ausente"
  departments_reference_count: 25

# --- Fase 3: RAG híbrido -------------------------------------------------------
embeddings:
  local:
    provider: "sentence-transformers"
    model_name: "intfloat/multilingual-e5-small"   # mismo modelo que Tarea 1, ya probado para retrieval

index:
  metric: "cosine"

rag_engine:
  top_k: 8
  # Calibrado con eval/results.json (Fase 4): similitud top-1 mínima in-scope
  # 0.8317, máxima out-of-scope 0.857 (solapamiento leve, igual que en la Tarea
  # 1 — la pregunta-trampa "de dominio pero fuera de corpus" empuja el máximo
  # out-of-scope hacia arriba). Umbral = punto medio de la evidencia.
  similarity_threshold: 0.844
  abstain_message: "No encuentro procesos de contratación en el corpus indexado (jul-sep 2026) que respalden esta consulta."
  llm_model_env_var: "OPENAI_CHAT_MODEL"   # nombre real del modelo se lee de .env (rama openai)
  # "openai" (gpt-4o-mini, requiere crédito) o "gemini" (capa gratuita de Google
  # AI Studio) — igual que en la Tarea 1, el issue no exige un proveedor
  # específico para este LLM.
  llm_provider: "gemini"

pricing:
  reference_date: "2026-09-23"
  usd_per_1m_tokens:
    gpt-4o-mini:
      input: 0.15
      output: 0.60
    gemini-flash-lite-latest:
      input: 0.0
      output: 0.0

# --- Fase 4: evaluación ---------------------------------------------------------
evaluation:
  eval_set_file: "eval/eval_set.json"
  k_values: [1, 3, 5, 8]
  results_file: "eval/results.json"

# --- Fase 5: indicador de riesgo -------------------------------------------------
risk:
  min_processes_for_ranking: 5   # umbral mínimo de procesos adjudicados para que un comprador/proveedor entre al ranking (evita ratios de 1/1 = 100% no representativos)
  top_n_buyers: 10

# --- Streamlit ------------------------------------------------------------------
streamlit:
  app_title: "Radar de Contrataciones Públicas — Perú (jul-sep 2026)"
